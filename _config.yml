# Site settings. Jekyll reads this file only when it starts: after editing it, stop the local
# preview (Ctrl+C) and start it again.

# Basic site settings
locale      : "en-US"
title       : "Mohammad Hussein Yoosefian Nooshabadi"
name        : &name "Mohammad Hussein Yoosefian Nooshabadi"
description : "Ph.D. Candidate"   # shown under the name in the sidebar
url         : https://mhyoosefian.github.io
baseurl     : ""
repository  : "mhyoosefian/mhyoosefian.github.io"
timezone    : America/New_York

# Site author. The sidebar links are edited in _data/profile.yml, not here.
author:
  portrait : "/images/profile-arch.jpeg"
  name     : *name

# Posts dated in the future are still published.
future: true

# Reading files
include:
  - _pages
  - files
exclude:
  - README.md
  - PUBLICATIONS.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - local
  - vendor
  - node_modules
  - .jekyll-cache

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Default layouts: blog posts (_posts/) use the post layout, all other pages the academic layout.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: academic

# Outputting
permalink: /:categories/:title/

# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
