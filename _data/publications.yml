  - id: formation-flight
    category: conference
    title: "Formation Flight Control and Path Tracking of a Multi-Quadrotor System in the Presence of Measurement Noise and Disturbances"
    authors:
      - "E. Abbasi"
      - "M. Ghayour"
      - "M. Danesh"
      - "P. Amiri"
      - "M. H. Yoosefian Nooshabadi"
    venue: "6th RSI International Conference on Robotics and Mechatronics (IcRoM)"
    year: 2018
    details: "pp. 273–279"
    status: "Published"
    abstract: >-
      This paper focuses on formation flight control of a multi-quadrotor system. Path tracking of
      this system is another subject which is in the spot light. When a fault occurs for leader of the
      group in the leader-follower structure, mission will be failed. In order to avoid this fault, in
      this paper virtual structure is used instead. The group uses two control loops for flight
      controlling. Inner loop which is used to control attitudes of agents, combines feedback
      linearization controller with PD controller. Outer loop which is designed for position control,
      uses a combination of consensus protocol with PID controller. There is measurement noise in the
      system, thereby exact values of the states are not available. In order to compensate these
      negative factor, Kalman filter is used, thus states values are estimated. Finally, effectiveness
      of the presented protocol is examined through stability analysis and numerical simulation.
    bibtex: |
      @inproceedings{abbasi2018formation,
        title={Formation flight control and path tracking of a multi-quadrotor system in the presence of measurement noise and disturbances},
        author={Abbasi, Ehsan and Ghayour, Mostafa and Danesh, Mohammad and Amiri, Peyman and Yoosefian, Mohammad Hussein},
        booktitle={2018 6th RSI International Conference on Robotics and Mechatronics (IcRoM)},
        pages={273--279},
        year={2018},
        organization={IEEE}
      }
    links:
      - label: "Link"
        url: "https://ieeexplore.ieee.org/abstract/document/8657620"
      - label: "PDF"
        url: "/files/papers/abbasi2018formation.pdf"

  - id: optimal-quadrotor-tracking
    category: conference
    title: "Optimal Path Tracking of a Quadrotor in the Presence of Obstacle Using the League Championship Algorithm"
    authors:
      - "E. Abbasi"
      - "M. Ghayour"
      - "M. Danesh"
      - "M. H. Yoosefian Nooshabadi"
    venue: "6th RSI International Conference on Robotics and Mechatronics (IcRoM)"
    year: 2018
    details: "pp. 236–242"
    status: "Published"
    abstract: >-
      Nowadays, cost reduction and optimization has attracted attention of researchers and scientists
      in many fields. Optimal path tracking for vehicles, which reduces fuel consumption, as well as
      the distance traversed by the vehicle, has mostly caught attention. Besides, Unmanned Aerial
      Vehicles are in the spotlight because of their great performance in doing a vast majority of
      jobs, especially those which are perilous for human. One of the most prevailing issues in this
      field is optimal path tracking. Although different algorithms are presented and despite their
      acceptable performance, none of them has focused on reducing energy and distance. In this paper
      a new optimization algorithm is utilized for the latter optimizations. This algorithm is called
      the Championship Algorithm by its Iranian developer. Combining it with the path tracking problem
      of the unmanned aerial vehicles, it is shown that its performance is much better than one of the
      most important existing algorithms (GA). Optimal trajectory tracking problem is also solved to
      reduce fuel and energy consumption.
    bibtex: |
      @inproceedings{abbasi2018optimal,
        title={Optimal path tracking of a quadrotor in the presence of obstacle using the League Championship Algorithm},
        author={Abbasi, Ehsan and Ghayour, Mostafa and Danesh, Mohammad and Yoosefian, Mohammad Hussein},
        booktitle={2018 6th RSI international conference on robotics and mechatronics (IcRoM)},
        pages={236--242},
        year={2018},
        organization={IEEE}
      }
    links:
