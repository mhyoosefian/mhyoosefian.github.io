        url: "https://scientiairanica.sharif.edu/article_23551.html"
      - label: "PDF"
        url: "/files/papers/nooshabadi2025development.pdf"

  - id: fast-msckf
    category: journal
    title: "An Improved Multi-State Constraint Kalman Filter for Visual-Inertial Odometry"
    authors:
      - "M. R. Abdollahi"
      - "S. H. Pourtakdoust"
      - "M. H. Yoosefian Nooshabadi"
      - "H. Nejat Pishkenari"
    venue: "Journal of the Franklin Institute"
    year: 2024
    details: "361(15), 107130"
    status: "Published"
    abstract: >-
      Fast pose estimation (PE) plays a vital role for agile autonomous robots in successfully
      carrying out their tasks. While Global Navigation Satellite Systems (GNSS) such as Global
      Positioning System (GPS) have been traditionally used along with Inertial Navigation Systems
      (INS) for PE, their viability is compromised in indoor and urban environments due to their low
      update rates and inadequate signal coverage. Visual-Inertial Odometry (VIO) is gaining
      popularity as a practical alternative to GNSS/INS systems in GNSS-denied environments. Among
      various VIO-based methods, the Multi-State Constraint Kalman Filter (MSCKF) has garnered
      significant attention due to its robustness, speed and accuracy. Nevertheless, high
      computational cost of image processing is still challenging for real-time implementation on
      resource-constrained vehicles. In this paper, an enhanced version of the MSCKF is proposed. The
      proposed approach differs from the original MSCKF in the feature marginalization and state
      pruning steps of the algorithm. This new design results in a faster algorithm with comparable
      accuracy. We validate the proposed algorithm using both an open-source dataset and real-world
      experiments. It is demonstrated that the proposed Fast-MSCKF (referred to as FMSCKF) is
      approximately six times faster and at least 20% more accurate in final position estimation
      compared to the standard MSCKF.
    bibtex: |
      @article{abdollahi2024improved,
        title={An improved multi-state constraint Kalman filter for visual-inertial odometry},
        author={Abdollahi, MR and Pourtakdoust, Seid H and Nooshabadi, MH Yoosefian and Pishkenari, Hossein Nejat},
        journal={Journal of the Franklin Institute},
        volume={361},
        number={15},
        pages={107130},
        year={2024},
        publisher={Elsevier}
      }
    links:
      - label: "Link"
        url: "https://www.sciencedirect.com/science/article/pii/S0016003224005519"
      - label: "PDF"
        url: "/files/papers/abdollahi2024improved.pdf"
      - label: "arXiv"
        url: "https://arxiv.org/abs/2210.08117"

  - id: stealthy-sensor-placement
    category: journal
    title: "Stealthy Optimal Range-Sensor Placement for Target Localization"
    authors:
      - "M. H. Yoosefian Nooshabadi"
      - "R. Sipahi"
      - "L. Lessard"
    venue: "IEEE Control Systems Letters"
    year: 2024
    details: "8, pp. 2763–2768"
    status: "Published"
    note: "Presented at the 2025 American Control Conference (ACC)."
    abstract: >-
      We study a stealthy range-sensor placement problem where a set of range sensors are to be
      placed with respect to targets to effectively localize them while maintaining a degree of
      stealthiness from the targets. This is an open and challenging problem since two competing
      objectives must be balanced: (a) optimally placing the sensors to maximize their ability to
      localize the targets and (b) minimizing the information the targets gather regarding the
      sensors. We provide analytical solutions in 2D for the case of any number of sensors that
      localize two targets.
    bibtex: |
      @article{nooshabadi2024stealthy,
        title={Stealthy Optimal Range-Sensor Placement for Target Localization},
        author={Nooshabadi, Mohammad Hussein Yoosefian and Sipahi, Rifat and Lessard, Laurent},
        journal={IEEE Control Systems Letters},
        volume={8},
        pages={2763--2768},
        year={2024},
        publisher={IEEE}
      }
    links:
      - label: "Link"
        url: "https://ieeexplore.ieee.org/abstract/document/10786353"
      - label: "PDF"
        url: "/files/papers/nooshabadi2024stealthy.pdf"

  - id: regularized-correntropy
    category: preprint
    title: "From Divergence to Provable Stability: Regularized Correntropy Kalman Filters"
    authors:
      - "M. H. Yoosefian Nooshabadi"
      - "L. Lessard"
    venue: "2027 American Control Conference (ACC)"
    year: 2026
    status: "Submitted"
    abstract: >-
      Correntropy-based Kalman filters (CoKFs) are nonlinear robust state estimators that have been
      shown to outperform the standard Kalman filter in the presence of non-Gaussian noise. In this
      paper, we show that under non-Gaussian process noise, a CoKF may perform poorly, and when the
      dynamical system is unstable, it may even diverge. We prove the error divergence for a scalar
      system. To overcome this issue, we propose a family of regularized CoKFs, called α-CoKFs, and
      prove that for any positive regularization level, the proposed estimator has bounded
      mean-square estimation error. Extensive numerical experiments show the α-CoKFs outperform the
      standard Kalman filter, while the standard CoKFs either perform poorly or are unstable.
    # PDF intentionally not posted yet (files/papers/nooshabadi2026divergence.pdf when ready).

  - id: dynamic-programming-estimation
    category: conference
    title: "State Estimation for Linear Systems with Non-Gaussian Measurement Noise via Dynamic Programming"
    authors:
      - "M. H. Yoosefian Nooshabadi"
      - "L. Lessard"
    venue: "IEEE 64th Conference on Decision and Control (CDC)"
    year: 2025
    details: "pp. 5612–5617"
    status: "Published"
    abstract: >-
      We propose a new recursive estimator for linear dynamical systems under Gaussian process noise
      and non-Gaussian measurement noise. Specifically, we develop an approximate maximum a
      posteriori (MAP) estimator using dynamic programming and tools from convex analysis. Our
      approach does not rely on restrictive noise assumptions and employs a Bellman-like update
      instead of a Bayesian update. Our proposed estimator is computationally efficient, with only
      modest overhead compared to a standard Kalman filter. Simulations demonstrate that our
      estimator achieves lower root mean squared error (RMSE) than the Kalman filter and has
      comparable performance to state-of-the-art estimators, while requiring significantly less
      computational power.
    bibtex: |
