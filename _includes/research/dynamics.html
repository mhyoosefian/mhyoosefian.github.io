<svg viewBox="0 0 240 170" role="img" aria-label="Sketch: a chain of three rigid bodies connected by joints, with generalized coordinates and a conserved momentum">
  <!-- ground -->
  <line x1="18" y1="144" x2="86" y2="144" stroke="var(--ink)" stroke-width="1.4"/>
  <g stroke="var(--muted)" stroke-width="1"><path d="M24 144 l-8 10 M36 144 l-8 10 M48 144 l-8 10 M60 144 l-8 10 M72 144 l-8 10 M84 144 l-8 10"/></g>
  <!-- reference lines -->
  <g stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="50" y1="140" x2="50" y2="108"/><line x1="75" y1="96.7" x2="75" y2="66"/><line x1="122" y1="79.6" x2="122" y2="52"/>
  </g>
  <!-- links (capsules) -->
  <g stroke-linecap="round">
    <g stroke="var(--ink)" stroke-width="13"><line x1="50" y1="140" x2="75" y2="96.7"/><line x1="75" y1="96.7" x2="122" y2="79.6"/><line x1="122" y1="79.6" x2="167.3" y2="100.7"/></g>
    <g stroke="var(--soft)" stroke-width="10"><line x1="50" y1="140" x2="75" y2="96.7"/><line x1="75" y1="96.7" x2="122" y2="79.6"/><line x1="122" y1="79.6" x2="167.3" y2="100.7"/></g>
  </g>
  <!-- end mass -->
  <circle cx="167.3" cy="100.7" r="11" fill="var(--nav-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <!-- joints -->
  <g fill="var(--bg)" stroke="var(--ink)" stroke-width="1.4">
    <circle cx="50" cy="140" r="4"/><circle cx="75" cy="96.7" r="4"/><circle cx="122" cy="79.6" r="4"/>
  </g>
  <!-- generalized coordinates -->
  <g fill="none" stroke="var(--accent)" stroke-width="1.3">
    <path d="M50 118 A22 22 0 0 1 61 121"/>
    <path d="M75 76.7 A20 20 0 0 1 93.8 89.9"/>
    <path d="M122 61.6 A18 18 0 0 1 138.3 87.2"/>
  </g>
  <g font-size="11.5" font-style="italic" fill="var(--accent)" font-family="Georgia, serif">
    <text x="55" y="109">q₁</text><text x="90" y="72">q₂</text><text x="143" y="66">q₃</text>
  </g>
  <!-- conserved momentum of an ignorable coordinate -->
  <path d="M206 44 a16 16 0 1 1 -16 -16" fill="none" stroke="var(--ink)" stroke-width="1.3"/>
  <path d="M186 24 l5 4 l-5 4" fill="none" stroke="var(--ink)" stroke-width="1.3"/>
  <text x="206" y="80" text-anchor="middle" font-size="11.5" font-style="italic" fill="var(--ink)" font-family="Georgia, serif">p = const</text>
</svg>
